name: Release

permissions: read-all

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zebodotdev/inttegro-sdk-swift'
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "${version}" = "$(sed -n 's/public let inttegroSDKVersion = "\([^"]*\)"/\1/p' Sources/Inttegro/Client.swift)"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
      - name: Run release checks and archive the source
        shell: bash
        run: |
          set -euo pipefail
          swift test --parallel
          swift package dump-package >/dev/null
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          git archive --format=tar --prefix="inttegro-sdk-swift-${version}/" "${GITHUB_SHA}" \
            | gzip -n > "artifacts/inttegro-sdk-swift-${version}.tar.gz"
      - name: Attest the source archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar.gz
      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATIONS.sigstore
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
            echo "package=https://github.com/${GITHUB_REPOSITORY}"
          } > artifacts/PROVENANCE.txt
          (cd artifacts && shasum -a 256 ./*.tar.gz ./ATTESTATIONS.sigstore ./PROVENANCE.txt > SHA256SUMS)
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "Inttegro Swift SDK ${GITHUB_REF_NAME}"
          --verify-tag
      - name: Finalize the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
